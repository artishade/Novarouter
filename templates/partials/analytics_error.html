{# Analytics fragment error panel — retry re-renders the whole tab root #}
<div class="nova-error rounded-xl border border-rose-500/30 bg-rose-500/10 p-6 text-center">
  <div class="mx-auto flex size-10 items-center justify-center rounded-lg border border-rose-500/30 bg-rose-500/10 text-rose-300">
    <i data-lucide="triangle-alert" class="size-5"></i>
  </div>
  <h2 class="mt-3 text-sm font-semibold text-rose-200">Analytics data unavailable</h2>
  <p class="mt-1 break-all font-mono text-xs text-rose-300/80">{{ message }}</p>
  <button type="button"
    class="mt-4 inline-flex items-center gap-2 rounded-md border border-rose-500/40 bg-[#0d1322] px-3 py-1.5 font-mono text-xs text-rose-200 transition-colors hover:border-rose-400 hover:text-rose-100"
    hx-get="/partials/tab/analytics" hx-vals='{"hours": {{ hours | default(24) }}}' hx-target="closest .nova-error" hx-swap="outerHTML">
    <i data-lucide="refresh-cw" class="size-3.5"></i>
    Retry
  </button>
</div>
