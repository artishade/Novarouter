[project]
name = "novarouter"
version = "1.0.0"
description = "Lightweight multi-provider AI API gateway with key rotation, model availability checker, and a built-in dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "pydantic>=2.10.4",
    "psycopg[binary,pool]>=3.2.3",
]

# Vercel Python runtime entrypoint: same `app` object uvicorn serves locally.
[tool.vercel]
entrypoint = "app.main:app"

[project.optional-dependencies]
serve = ["uvicorn[standard]>=0.34.0"]