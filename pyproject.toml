[project]
name = "novarouter"
version = "2.0.0"
description = "Multi-provider AI API gateway: chat, tools, vision, thinking, images, video, audio, Responses + Anthropic APIs — with key rotation, failover, rate limits, and a model availability checker."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "pydantic>=2.10.4",
    "psycopg[binary,pool]>=3.2.3",
]

# Vercel Python runtime entrypoint: same `app` object uvicorn serves locally.
[tool.vercel]
entrypoint = "app.main:app"

[project.optional-dependencies]
serve = ["uvicorn[standard]>=0.34.0"]