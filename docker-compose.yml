services:
  novarouter:
    build: .
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    environment:
      # Render injects PORT dynamically; compose default kept for local runs.
      - PORT=${PORT:-10000}
      - DATABASE_URL=file:/app/db/custom.db
      # Or a free Postgres (Neon/Supabase/Aiven):
      # - DATABASE_URL=postgresql://user:password@host/dbname?sslmode=require
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    volumes:
      - nova-db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+__import__('os').environ.get('PORT','10000')+'/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nova-db:
