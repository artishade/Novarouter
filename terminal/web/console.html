<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaRouter Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<style>
  :root {
    --bg: #0a0d14; --panel: #10151f; --line: #22262f; --fg: #d7dae0;
    --dim: #8b93a3; --accent: #4d9fff; --ok: #34d399; --warn: #fbbf24; --err: #fb7185;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --ui: 13px;
    --fs: 13px;            /* terminal font size, adjustable */
    --split: 380px;        /* the agent pane's width, draggable */
    --head: 36px;
    --strip: 34px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font: var(--ui)/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 6px var(--split);
    grid-template-rows: var(--head) var(--strip) minmax(0, 1fr);
    grid-template-areas: "head head head" "strip strip strip" "shell split agent";
    transition: grid-template-columns .16s ease;
  }
  body.agent-collapsed { grid-template-columns: minmax(0, 1fr) 0 0; }
  body.agent-collapsed #split { display: none; }
  body.agent-collapsed #agent { display: none; }
  body.term-collapsed { grid-template-rows: var(--head) 0 0; }
  body.term-collapsed #strip, body.term-collapsed #shell, body.term-collapsed #split { display: none; }
  body.expanded { grid-template-columns: minmax(0, 1fr) 6px 0; }
  body.expanded #agent, body.expanded #split { display: none; }
  body.expanded #shell { grid-area: shell; }

  /* ---- chrome ---- */
  .head {
    grid-area: head; display: flex; align-items: stretch; gap: 2px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .head .ptitle {
    display: flex; align-items: center; gap: 8px; padding: 0 14px;
    font: 600 11px var(--mono); letter-spacing: .06em; color: var(--dim);
    border-right: 1px solid var(--line); white-space: nowrap;
  }
  .head .ptitle.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
  .head .grow { flex: 1; }
  .acts { display: flex; align-items: center; gap: 2px; padding: 0 6px; }
  .zoom { display: flex; align-items: center; gap: 4px; padding: 0 6px;
          font: 11px var(--mono); color: var(--dim); }
  .zoom b { min-width: 34px; text-align: center; font-weight: 500; }

  button.icon, .icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0; border: 0; border-radius: 5px;
    background: transparent; color: var(--dim); cursor: pointer;
  }
  button.icon:hover { background: #1b2130; color: var(--fg); }
  button.icon[aria-pressed="true"] { color: var(--accent); }
  button.icon:focus-visible { outline: 1px solid var(--accent); }
  svg { width: 15px; height: 15px; fill: none; stroke: currentColor;
        stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- session strip ---- */
  .strip {
    grid-area: strip; display: flex; align-items: stretch; gap: 4px;
    background: #0d1118; border-bottom: 1px solid var(--line);
    padding: 0 8px; overflow-x: auto; scrollbar-width: thin;
  }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 0 10px;
    border: 1px solid transparent; border-radius: 5px; background: transparent;
    color: var(--dim); font: 12px var(--mono); white-space: nowrap; cursor: pointer;
    max-width: 260px;
  }
  .tab:hover { background: #141a25; color: var(--fg); }
  .tab.on { background: var(--bg); border-color: var(--line); color: var(--fg); }
  .tab .lbl { overflow: hidden; text-overflow: ellipsis; }
  .tab .cwd { color: #5f6775; font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  .tab .kill { color: #5f6775; padding: 0 2px; border-radius: 3px; }
  .tab .kill:hover { color: var(--err); }
  .strip .sep { width: 1px; background: var(--line); margin: 6px 4px; flex: none; }

  /* ---- panes ---- */
  #shell { grid-area: shell; position: relative; min-width: 0; min-height: 0; display: flex; }
  #screen { flex: 1; min-width: 0; min-height: 0; padding: 6px 4px 6px 10px; overflow: hidden; }
  #screen .xterm { height: 100%; }
  #screen:focus { outline: none; }
  pre.plain {
    margin: 0; height: 100%; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font: var(--fs)/1.45 var(--mono); color: #c7d0dd;
  }
  #screen .note { font: 11px var(--mono); color: var(--warn); padding: 4px 0 0; }
  .where {
    position: absolute; right: 10px; bottom: 6px; font: 11px var(--mono);
    color: #4b5563; background: rgba(10,13,20,.7); padding: 1px 6px; border-radius: 4px;
    pointer-events: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---- the bar you drag ---- */
  #split {
    grid-area: split; background: var(--line); cursor: col-resize; position: relative;
  }
  #split::after {
    content: ""; position: absolute; inset: 0 -4px;   /* a real hit target */
  }
  #split:hover, #split.dragging { background: var(--accent); }
  #split::before {
    content: ""; position: absolute; top: 50%; left: 50%; width: 2px; height: 26px;
    transform: translate(-50%, -50%); border-radius: 2px; background: #0a0d14; opacity: .55;
  }
  #split:focus-visible { outline: 1px solid var(--accent); background: var(--accent); }

  /* ---- agent ---- */
  #agent {
    grid-area: agent; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  #agent .head { border-bottom: 1px solid var(--line); }
  #log { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px;
         display: flex; flex-direction: column; gap: 10px; }
  .msg { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
         white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); }
  .msg.you { background: #121a29; }
  .msg.bot { background: #0e1521; }
  .msg.tool { color: var(--dim); border-style: dashed; font-size: 11.5px; }
  .msg.err { border-color: var(--err); color: var(--err); }
  .who { font: 600 10px var(--mono); letter-spacing: .08em; color: var(--dim);
         display: block; margin-bottom: 5px; }
  .empty { margin: auto; text-align: center; color: #5f6775; font: 12px var(--mono);
           max-width: 300px; }
  .empty strong { display: block; color: var(--dim); font-size: 12.5px; margin-bottom: 8px; }

  .providers { border-top: 1px solid var(--line); padding: 10px; }
  .providers[hidden] { display: none; }
  .list { max-height: 128px; overflow: auto; display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .prov { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line);
          border-radius: 6px; padding: 4px 6px; font: 11px var(--mono); }
  .prov.on { border-color: var(--accent); }
  .prov .u { flex: 1; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); align-items: flex-end; }
  form.stack { flex-direction: column; gap: 6px; }
  textarea, input, select {
    background: #0b0f17; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; font: 12px var(--mono); width: 100%;
  }
  textarea { resize: vertical; min-height: 52px; }
  textarea:focus, input:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .btn { background: #182130; color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
         padding: 6px 12px; font: 500 12px var(--mono); cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .hint { font: 11px var(--mono); color: #5f6775; padding: 0 12px 8px; }

  .resizer { display: none; }
  .mobile-switch { display: none; }

  /* ---- phone: stack, drag horizontally, one pane at a time ---- */
  @media (max-width: 860px) {
    body {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: var(--head) var(--strip) minmax(0, 1fr) 10px var(--agent-rows, 44%);
      grid-template-areas: "head" "strip" "shell" "split" "agent";
      --split: 0px;
    }
    #split { cursor: row-resize; }
    body.agent-collapsed { grid-template-rows: var(--head) var(--strip) minmax(0, 1fr) 10px 0; }
    body.agent-collapsed #agent, body.agent-collapsed #split { display: none; }
    body.expanded { grid-template-rows: 0 0 minmax(0, 1fr) 0 0; }
    body.expanded #agent, body.expanded #split, body.expanded #strip { display: none; }
    button.icon { width: 38px; height: 38px; }
    .icon { width: 34px; height: 34px; }
    svg { width: 17px; height: 17px; }
    :root { --head: 46px; --strip: 42px; }
    .zoom { display: none; }
    .mobile-switch {
      display: flex; position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20;
      background: var(--panel); border: 1px solid var(--line); border-radius: 999px; overflow: hidden;
    }
    .mobile-switch button {
      border: 0; background: transparent; color: var(--dim); padding: 9px 16px;
      font: 11px var(--mono); cursor: pointer;
    }
    .mobile-switch button.on { background: #1b2231; color: var(--fg); }
  }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>
</head>
<body>

<header class="head" id="head">
  <span class="ptitle on">Terminal</span>
  <span class="ptitle" id="agentTitle">Chat</span>
  <span class="grow"></span>
  <span class="zoom" role="group" aria-label="terminal text size">
    <button class="icon" id="zoomOut" type="button" aria-label="smaller text">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
    <b id="zoomRead" aria-live="polite">13px</b>
    <button class="icon" id="zoomIn" type="button" aria-label="larger text">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon" id="zoomReset" type="button" aria-label="reset text size">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </span>
  <div class="acts" role="group" aria-label="terminal actions">
    <button class="icon" id="new" type="button" aria-label="new session">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon" id="rename" type="button" aria-label="rename this session">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <button class="icon" id="copy" type="button" aria-label="copy the visible screen">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
    </button>
    <button class="icon" id="menu" type="button" aria-label="more actions" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </button>
    <button class="icon" id="expand" type="button" aria-label="expand the terminal" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
    </button>
    <button class="icon" id="closePanel" type="button" aria-label="close the terminal panel">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
</header>

<nav class="strip" id="tabs" role="tablist" aria-label="terminal sessions"></nav>

<section id="shell">
  <div id="screen" aria-label="terminal output" role="application"></div>
  <div class="where" id="where" aria-live="polite"></div>
</section>

<div id="split" role="separator" aria-orientation="vertical" tabindex="0"
     aria-label="resize the chat panel — drag, or click to collapse"
     aria-valuemin="240" aria-valuemax="900" aria-valuenow="380"></div>

<aside id="agent">
  <header class="head">
    <span class="ptitle on">Chat</span>
    <span class="grow"></span>
    <div class="acts">
      <select id="provider" aria-label="agent provider" style="width:auto;max-width:150px"></select>
      <button class="icon" id="newChat" type="button" aria-label="start a new conversation">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon" id="manage" type="button" aria-label="manage providers">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      </button>
      <button class="icon" id="expandAgent" type="button" aria-label="expand the chat panel" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
      </button>
      <button class="icon" id="closeAgent" type="button" aria-label="close the chat panel">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <div id="log" aria-live="polite" aria-label="agent conversation"></div>

  <div class="providers" id="providerBox" hidden>
    <div class="list" id="provList"></div>
    <form id="provForm" class="stack">
      <input id="p_id" placeholder="id — groq, openrouter, local-vllm" aria-label="provider id" required>
      <input id="p_url" placeholder="base url — https://api.groq.com/openai/v1" aria-label="base url" required>
      <input id="p_model" placeholder="model — optional" aria-label="model">
      <input id="p_key" type="password" placeholder="api key — blank keeps the stored one" aria-label="api key">
      <button class="btn" type="submit">save provider</button>
      <span class="hint" id="registry"></span>
    </form>
  </div>

  <div class="hint">Every command the agent runs appears in a terminal tab.</div>
  <form id="composer">
    <textarea id="input" aria-label="message to the agent"
      placeholder="deploy the site and tail the log"></textarea>
    <button class="btn" type="submit">send</button>
  </form>
</aside>

<div class="mobile-switch" id="mobileSwitch" role="tablist" aria-label="panes">
  <button type="button" data-pane="shell" class="on" role="tab" aria-selected="true">Terminal</button>
  <button type="button" data-pane="agent" role="tab" aria-selected="false">Agent</button>
</div>

<script src="/static/console.js"></script>
</body>
</html>
