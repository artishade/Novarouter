    <rect x="342" y="550" width="210" height="24" rx="5" fill="#022c22" stroke="#047857"/><text x="354" y="566" fill="#e57979">anthropic/claude-3-5-sonnet</text>
    <rect x="560" y="550" width="150" height="24" rx="5" fill="#000000" fill-opacity="0.35" stroke="#262626"/><text x="572" y="566" fill="#a3a3a3">anthropic/claude-3-opus</text>
    <rect x="718" y="550" width="140" height="24" rx="5" fill="#000000" fill-opacity="0.35" stroke="#262626"/><text x="730" y="566" fill="#a3a3a3">claude-3-haiku</text>
    <rect x="342" y="582" width="168" height="24" rx="5" fill="#022c22" stroke="#047857"/><text x="354" y="598" fill="#e57979">groq/llama-3.3-70b</text>
    <rect x="518" y="582" width="150" height="24" rx="5" fill="#000000" fill-opacity="0.35" stroke="#262626"/><text x="530" y="598" fill="#a3a3a3">mistral/mistral-large</text>
    <rect x="676" y="582" width="120" height="24" rx="5" fill="#000000" fill-opacity="0.35" stroke="#262626"/><text x="688" y="598" fill="#a3a3a3">nvidia/llama-405b</text>
  </g>

  <text x="330" y="672" fill="#d4d4d4" font-size="12.5">Chain order (2)</text>
  <rect x="330" y="682" width="230" height="26" rx="6" fill="#022c22" stroke="#047857"/><text x="342" y="699" fill="#e57979" font-size="11" font-family="ui-monospace,Menlo,monospace">F1 anthropic/claude-3-5-sonnet</text>
  <rect x="568" y="682" width="176" height="26" rx="6" fill="#022c22" stroke="#047857"/><text x="580" y="699" fill="#e57979" font-size="11" font-family="ui-monospace,Menlo,monospace">F2 groq/llama-3.3-70b</text>
  <rect x="760" y="682" width="110" height="26" rx="6" fill="#b01414"/><text x="815" y="699" fill="#052e16" font-size="11.5" font-weight="700" text-anchor="middle">Create route</text>
