<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial" role="img" aria-label="RouterX fallback route builder with model search">
  <rect width="1200" height="780" fill="#050505"/>
  <rect x="0" y="0" width="236" height="780" fill="#0a0a0a"/><line x1="236" y1="0" x2="236" y2="780" stroke="#262626"/>
  <circle cx="36" cy="42" r="12" fill="#d43a3a"/><text x="60" y="48" fill="#e5e5e5" font-size="17" font-weight="700">RouterX</text>
  <g font-size="13.5" fill="#a3a3a3">
    <text x="40" y="122">Overview</text><text x="40" y="154">Console</text><text x="40" y="186">Terminal</text><text x="40" y="218">Providers</text><text x="40" y="250">Models</text>
    <rect x="16" y="264" width="204" height="34" rx="7" fill="#064e3b"/><text x="40" y="286" fill="#e57979" font-weight="600">Routes</text>
    <text x="40" y="330">Keys</text><text x="40" y="362">Storage</text><text x="40" y="394">Analytics</text><text x="40" y="426">Logs</text>
  </g>

  <text x="270" y="46" fill="#e5e5e5" font-size="20" font-weight="700">Fallback routes</text>
  <rect x="470" y="28" width="86" height="24" rx="6" fill="#0a0a0a" stroke="#262626"/><text x="513" y="45" fill="#a3a3a3" font-size="11.5" text-anchor="middle">4 routes</text>
  <rect x="566" y="28" width="250" height="24" rx="6" fill="#0a0a0a" stroke="#262626"/><text x="580" y="45" fill="#a3a3a3" font-size="11.5">7 healthy models as stand-ins</text>
  <rect x="1010" y="24" width="160" height="32" rx="7" fill="#b01414"/><text x="1090" y="45" fill="#052e16" font-size="12.5" font-weight="700" text-anchor="middle">+ New Route</text>

  <rect x="270" y="86" width="900" height="72" rx="10" fill="#052e16" stroke="#065f46"/>
  <text x="290" y="112" fill="#e57979" font-size="13" font-weight="700">Identity spoofing keeps clients happy</text>
  <text x="290" y="134" fill="#a3a3a3" font-size="12">Stage 1 direct · stage 2 your explicit chain · stage 3 auto stand-ins across every other healthy provider · free engine last.</text>

  <!-- route cards -->
  <rect x="270" y="176" width="900" height="70" rx="10" fill="#0b0b0b" stroke="#312e81"/>
  <text x="290" y="206" fill="#e57979" font-size="14" font-family="ui-monospace,Menlo,monospace">*</text>
  <rect x="330" y="190" width="96" height="18" rx="4" fill="#2e1065"/><text x="378" y="203" fill="#c4b5fd" font-size="10" text-anchor="middle" font-weight="700">DEFAULT CHAIN</text>
  <text x="290" y="230" fill="#a3a3a3" font-size="11.5" font-family="ui-monospace,Menlo,monospace">auto stand-ins → any healthy provider</text>

  <rect x="270" y="260" width="900" height="70" rx="10" fill="#0b0b0b" stroke="#262626"/>
  <text x="290" y="290" fill="#e57979" font-size="14" font-family="ui-monospace,Menlo,monospace">gpt-4o</text>
  <rect x="380" y="274" width="34" height="18" rx="4" fill="#262626"/><text x="397" y="287" fill="#a3a3a3" font-size="10" text-anchor="middle">auto</text>
  <text x="290" y="314" fill="#a3a3a3" font-size="11.5" font-family="ui-monospace,Menlo,monospace">groq/llama-3.3-70b  ·  mistral/mistral-large  → auto stand-ins</text>

  <!-- dialog -->
  <rect x="300" y="356" width="600" height="392" rx="14" fill="#0b0b0b" stroke="#404040"/>
  <text x="330" y="394" fill="#e5e5e5" font-size="16" font-weight="700">New fallback route</text>
  <text x="330" y="416" fill="#737373" font-size="12">Map a public model id to an ordered chain of upstream models.</text>

  <text x="330" y="446" fill="#d4d4d4" font-size="12.5">Public model id</text>
  <rect x="510" y="432" width="360" height="28" rx="6" fill="#070b13" stroke="#262626"/><text x="522" y="451" fill="#d4d4d4" font-size="12" font-family="ui-monospace,Menlo,monospace">my-model</text>

  <text x="330" y="486" fill="#d4d4d4" font-size="12.5">Pick fallback models (in order)</text>
  <!-- search input (the feature) -->
  <rect x="330" y="496" width="540" height="32" rx="7" fill="#070b13" stroke="#b01414"/>
  <circle cx="348" cy="512" r="5.5" fill="none" stroke="#737373" stroke-width="1.6"/><line x1="352" y1="516" x2="357" y2="521" stroke="#737373" stroke-width="1.6"/>
  <text x="366" y="516" fill="#d4d4d4" font-size="12.5" font-family="ui-monospace,Menlo,monospace">claude</text><rect x="424" y="504" width="2" height="16" fill="#d43a3a"/>
  <text x="845" y="516" fill="#475569" font-size="10.5" text-anchor="end" font-family="ui-monospace,Menlo,monospace">live search · /ui/routes/models</text>

  <rect x="330" y="538" width="540" height="104" rx="8" fill="#000000" fill-opacity="0.28" stroke="#262626"/>
